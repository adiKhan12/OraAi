name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install packager
        run: npm install --save-dev @electron/packager

      - name: Compile accessibility helper
        run: swiftc -O -o helpers/ax-elements helpers/ax-elements.swift -framework Cocoa

      - name: Package app
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npx @electron/packager . OraAI \
            --platform=darwin \
            --arch=arm64 \
            --overwrite \
            --app-bundle-id=com.oraai.app \
            --app-version="${VERSION}" \
            --extend-info=Info.plist \
            --extra-resource=helpers/ax-elements

      - name: Sign app
        run: codesign --force --deep --sign - OraAI-darwin-arm64/OraAI.app

      - name: Create zip
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd OraAI-darwin-arm64
          zip -r -y "../OraAI-v${VERSION}-mac-arm64.zip" OraAI.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: OraAI-v*-mac-arm64.zip
          generate_release_notes: true
          body: |
            ## OraAI ${{ github.ref_name }}

            ### Install
            1. Download the `.zip` below, unzip, drag `OraAI.app` to Applications
            2. Add your API keys — open Terminal and run:
            ```
            mkdir -p ~/.oraai
            nano ~/.oraai/.env
            ```
            Paste this and save:
            ```
            OPENROUTER_API_KEY=your-key-here
            ELEVENLABS_API_KEY=your-key-here
            ```
            Get keys from [OpenRouter](https://openrouter.ai) and [ElevenLabs](https://elevenlabs.io)

            ### Before first launch
            3. **Gatekeeper**: macOS may block OraAI — go to System Settings → Privacy & Security, scroll down, click "Open Anyway"
            4. **Accessibility**: Go to System Settings → Privacy & Security → Accessibility → click "+" → add OraAI.app → toggle ON. This is required for pixel-perfect guidance.
            5. **Microphone**: macOS will prompt on first launch — click Allow
            6. **Screen sharing**: OraAI will show a screen picker on first launch — select your screen and click Share

            ### Use
            **Option+Space** to talk. Ask about anything on your screen.

            To uninstall, drag OraAI.app to Trash and `rm -rf ~/.oraai`
