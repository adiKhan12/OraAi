name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install && npm install --save-dev @electron/packager

      - name: Compile helpers
        run: |
          swiftc -O -o helpers/ax-elements helpers/ax-elements.swift -framework Cocoa
          swiftc -O -o helpers/input-actions helpers/input-actions.swift -framework CoreGraphics

      - name: Package app
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npx @electron/packager . OraAI \
            --platform=darwin \
            --arch=arm64 \
            --overwrite \
            --app-bundle-id=com.oraai.app \
            --app-version="${VERSION}" \
            --extend-info=Info.plist \
            --extra-resource=helpers/ax-elements \
            --extra-resource=helpers/input-actions

      - name: Sign and zip
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          codesign --force --deep --sign - OraAI-darwin-arm64/OraAI.app
          cd OraAI-darwin-arm64 && zip -r -y "../OraAI-v${VERSION}-mac-arm64.zip" OraAI.app

      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: OraAI-v*-mac-arm64.zip

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install && npm install --save-dev @electron/packager

      - name: Package app
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npx @electron/packager . OraAI \
            --platform=win32 \
            --arch=x64 \
            --overwrite \
            --app-version="${VERSION}"

      - name: Create zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          Compress-Archive -Path "OraAI-win32-x64\*" -DestinationPath "OraAI-v${version}-win-x64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-build
          path: OraAI-v*-win-x64.zip

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mac-build/OraAI-v*-mac-arm64.zip
            win-build/OraAI-v*-win-x64.zip
          generate_release_notes: true
          body: |
            ## OraAI ${{ github.ref_name }}

            ### macOS
            1. Download `OraAI-v*-mac-arm64.zip`, unzip, drag to Applications
            2. Add API keys: `mkdir -p ~/.oraai && nano ~/.oraai/.env`
            3. Gatekeeper may block it — System Settings → Privacy & Security → Open Anyway
            4. Grant Microphone + Screen sharing when prompted
            5. Optional: enable Accessibility for pixel-perfect mode

            ### Windows
            1. Download `OraAI-v*-win-x64.zip`, unzip anywhere
            2. Create `.env` file in the OraAI folder with your API keys:
            ```
            OPENROUTER_API_KEY=your-key-here
            ELEVENLABS_API_KEY=your-key-here
            ```
            3. Run `OraAI.exe`
            4. Grant Microphone when prompted

            ### Use
            **Alt+Space** to talk. Ask about anything on your screen.
