name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install packager
        run: npm install --save-dev @electron/packager

      - name: Compile accessibility helper
        run: swiftc -O -o helpers/ax-elements helpers/ax-elements.swift -framework Cocoa

      - name: Package app
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npx @electron/packager . OraAI \
            --platform=darwin \
            --arch=arm64 \
            --overwrite \
            --app-bundle-id=com.oraai.app \
            --app-version="${VERSION}" \
            --extend-info=Info.plist \
            --extra-resource=helpers/ax-elements

      - name: Sign app
        run: codesign --force --deep --sign - OraAI-darwin-arm64/OraAI.app

      - name: Create zip
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd OraAI-darwin-arm64
          zip -r -y "../OraAI-v${VERSION}-mac-arm64.zip" OraAI.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: OraAI-v*-mac-arm64.zip
          generate_release_notes: true
          body: |
            ## OraAI ${{ github.ref_name }}

            **Download the zip → Unzip → Drag OraAI.app to Applications → Open it.**

            On first launch, grant Microphone, Screen Recording, and Accessibility when prompted.

            You'll need API keys from [OpenRouter](https://openrouter.ai) and [ElevenLabs](https://elevenlabs.io) — create a `.env` file next to the app with your keys. See README for details.

            **Option+Space** to talk. To uninstall, drag to Trash.
